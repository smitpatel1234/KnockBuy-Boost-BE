get:
  summary: Get paginated items
  tags:
    - Item
  parameters:
    - in: query
      name: page
      schema:
        type: integer
      example: 1
    - in: query
      name: limit
      schema:
        type: integer
      example: 10
    - in: query
      name: filters
      schema:
        type: string
    - in: query
      name: sort
      schema:
        type: string
  responses:
    '200':
      description: Paginated items fetched successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode:
                type: integer
              success:
                type: boolean
              message:
                type: string
              data:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../_schemas.yaml#/components/ItemRes'
                  meta:
                    $ref: '../../_schemas.yaml#/components/PaginationMeta'
    '500':
      description: Server error
