type: object
properties:
  pageParams:
    type: object
    properties:
      pagination:
        type: object
        properties:
          page:
            type: integer
            example: 1
          limit:
            type: integer
            example: 10
        required:
          - page
          - limit

      filters:
        type: array
        items:
          type: object
          properties:
            column:
              type: string
              example: "status"
            value:
              type: string
              example: "active"
          required:
            - column
            - value

      sort:
        type: object
        properties:
          column:
            type: string
            example: "created_at"
          order:
            type: string
            enum:
              - ASC
              - DESC
            example: ASC
        required:
          - column

  required:
    - pagination
    - filters
    - sort
