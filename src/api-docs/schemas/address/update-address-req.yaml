type: object
properties:
  address_id:
    type: string
    format: uuid
    example: 123e4567-e89b-12d3-a456-426614174000
  address_line1:
    type: string  
    example: "afkldlfa jlkfa sd fkak fakl"
  address_line2:
    type: string
    example: "jjdflkaj fka fakld fka f "
  city:
    type: string
    example: "Halol"
  state:
    type: string
    example: "Gujarat"
  country:
    type: string
    example: "India"
  pincode:
    type: number
    example: 123456


required:
    - address_id
    - address_line2
    - address_line1
    - city
    - state
    - country
    - pincode