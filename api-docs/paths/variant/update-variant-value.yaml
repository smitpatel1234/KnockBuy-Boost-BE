put:
  summary: Update Variant Value
  tags:
    - Variant Values
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../_schemas.yaml#/components/UpdateVariantValueReq'
  responses:
    '200':
      description: Variant value updated successfully
    '400':
      description: Bad request - Invalid input
    '401':
      description: Unauthorized - Missing or invalid authentication token
    '404':
      description: Variant value not found
    '500':
      description: Internal server error
