get:
  summary: Get paginated users
  tags:
    - User
  security:
    - BearerAuth: []
  parameters:
    - in: query
      name: page
      schema:
        type: integer
      example: 1
    - in: query
      name: limit
      schema:
        type: integer
      example: 10
    - in: query
      name: filters
      schema:
        type: string
      description: "JSON array of filters, e.g. [{\"column\": \"username\", \"value\": \"jdoe\"}]"
    - in: query
      name: sort
      schema:
        type: string
      description: "JSON array of sort, e.g. [{\"column\": \"username\", \"order\": \"ASC\"}]"
  responses:
    '200':
      description: Paginated users fetched successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode:
                type: integer
              success:
                type: boolean
              message:
                type: string
              data:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../_schemas.yaml#/components/UserProfile'
                  meta:
                    $ref: '../../_schemas.yaml#/components/PaginationMeta'
    '500':
      description: Server error
